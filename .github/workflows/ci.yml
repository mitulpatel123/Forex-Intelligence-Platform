name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      timescaledb:
        image: timescale/timescaledb:2.18.1-pg16
        env:
          POSTGRES_USER: forex
          POSTGRES_PASSWORD: forex_local_only
          POSTGRES_DB: forex
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U forex -d forex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FIP_REDIS_URL: redis://127.0.0.1:6380/0
      FIP_DATABASE_URL: postgresql://forex:forex_local_only@127.0.0.1:55432/forex

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync --extra dev --locked
          pnpm install --frozen-lockfile

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Generated contract parity
        run: make check-generated

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: TypeScript type check
        run: pnpm extension:typecheck

      - name: Python tests
        run: uv run pytest -q packages adapters apps/collector/tests

      - name: Extension and manifest safety tests
        run: pnpm extension:test

      - name: Redis and TimescaleDB integration test
        run: |
          uv run python scripts/migrate.py
          uv run pytest -q tests/integration

      - name: End-to-end smoke test
        env:
          FIP_SMOKE_REUSE_DATA_SERVICES: "true"
          FIP_BIND_HOST: "0.0.0.0"
        run: make smoke

      - name: Bounded four-pair load test
        run: make load-test

      - name: Secret scan
        run: |
          curl -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact
